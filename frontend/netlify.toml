[build]
  command = "npm run build"
  publish = "build"

# Proxy API requests to your Oracle Cloud backend
[[redirects]]
  from = "/api/*"
  to = "http://144.24.242.189:3002/api/:splat"
  status = 200
  force = true

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"